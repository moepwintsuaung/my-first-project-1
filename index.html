<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Project - Masha</title>
    <style>
        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        .masha-img {
            width: 200px;
            height: auto;
            object-fit: cover;
            border-radius: 15px;
            border: 4px solid #d63384;
            margin-bottom: 20px;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Masha Image အစားထိုးထားခြင်း -->
        <img class="masha-img" src="masha.jpg" alt="Masha">
        
        <h1>Hello There👋</h1>
        <p>Welcome to my website!</p>
    </div>

</body>
</html>
